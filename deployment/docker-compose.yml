# Local values default via ${VAR:-default} so `docker-compose up` still
# works out of the box for a demo, but every credential is overridable
# from a .env file (see .env.example) and none are committed as literals
# anymore — the previous version hardcoded a real-looking password
# ("ali147") directly in this file.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-taskmgmt}
      POSTGRES_USER: ${DB_USER:-taskmgmt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskmgmt_dev_only}
    ports: ["5432:5432"]
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskmgmt}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.6
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Exposes Kafka consumer-group lag as Prometheus metrics. Needed because
  # the deployment guide's monitoring table and the KEDA ScaledObject in
  # k8s-manifests.yaml both depend on lag data that nothing was actually
  # producing before.
  kafka-exporter:
    image: danielqsj/kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    ports: ["9308:9308"]
    depends_on:
      kafka:
        condition: service_healthy

  java-backend:
    build: ../backend/java-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-taskmgmt}
      DB_USER: ${DB_USER:-taskmgmt}
      DB_PASSWORD: ${DB_PASSWORD:-taskmgmt_dev_only}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CACHE_TYPE: redis
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-min-32-bytes-long}

  python-ai-service:
    build: ../backend/python-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports: ["8000:8000"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-taskmgmt}
      DB_USER: ${DB_USER:-taskmgmt}
      DB_PASSWORD: ${DB_PASSWORD:-taskmgmt_dev_only}
      KAFKA_BOOTSTRAP: kafka:9092

  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # Previously Grafana started with zero datasources/dashboards, so
      # the "06-grafana-dashboard.png" screenshot could only have come
      # from manual clicking that isn't reproducible from this repo.
      # These provisioning files make the same dashboard come up
      # automatically on first boot.
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  pgdata:
